
spring.application.name=banking-fraud-detection

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/banking_fraud_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=3600

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB
app.upload.max-file-size-bytes=209715200
app.upload.directory=${user.home}/.banking-fraud-detection/uploads
app.ml.url=${ML_SERVICE_URL:http://localhost:8000}
